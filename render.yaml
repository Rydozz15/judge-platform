services:
  - type: web
    name: mentoria-judge-platform
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: EVAL_ADMIN_PASSWORD
        sync: false
      - key: EVAL_SECRET_KEY
        generateValue: true
      - key: EVAL_CORS_ORIGINS
        value: "*"
      - key: EVAL_DB_PATH
        value: "./data/evaluation.db"
